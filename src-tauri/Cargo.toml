[package]
name = "fitness-notes"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fitness_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-wdio = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-wdio-webdriver = "1.3.0"

[features]
# Compiles in the deterministic test fixtures (test_fixtures.rs) that wipe and
# reseed the database on every boot. Only used by the WDIO test build — never
# enable for production or daily use.
wdio = []

[profile.dev]
incremental = true

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
panic = "abort"
strip = true

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2"
